name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore previous Pages static assets
        uses: actions/cache/restore@v4
        with:
          path: .pages-static-cache
          key: pages-static-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pages-static-v1-${{ runner.os }}-${{ github.ref_name }}-

      - name: Build static site
        run: npm run build:pages
        env:
          GITHUB_PAGES: "true"

      - name: Merge previous and current Pages static assets
        shell: bash
        run: |
          mkdir -p .pages-static-cache
          cp -a out/_next/static/. .pages-static-cache/
          rm -rf out/_next/static
          mkdir -p out/_next/static
          cp -a .pages-static-cache/. out/_next/static/

      - name: Save current Pages static assets
        uses: actions/cache/save@v4
        with:
          path: .pages-static-cache
          key: pages-static-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
